# dacha2 redis fallback settings, re-read every 5 seconds (dacha2.redis.config-file). Comment out
# dacha2.redis.url to switch the fallback off without restarting dacha2.
# key-prefix must match MR's redis.key-prefix (mr-config/application.env)
dacha2.redis.url=redis://redis:6379
dacha2.redis.password=featurehub-e2e
dacha2.redis.key-prefix=e2e
